<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>World Dashboard - GDELT 驱动新闻地图https://github.com/yangkang5303</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 默认与页面同源（Cloudflare Worker 同时提供页面与 /api）。仅当 API 部署在其他域名时才需填写 -->
    <meta name="backend-base-url" content="" />
    <link rel="preload" href="./world.geo.json" as="fetch" type="application/json" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fastly.jsdelivr.net" crossorigin />
    <style>
      :root {
        color-scheme: dark;
        font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
        --bg: #0b101b;
        --panel-bg: rgba(18, 24, 38, 0.85);
        --accent: #4cc9f0;
        --accent-strong: #f72585;
        --text: #e0ecff;
        --text-soft: #93a3c4;
      }

      body {
        margin: 0;
        padding: 0;
        background: radial-gradient(circle at top, #10192b, #05070c);
        color: var(--text);
      }

      header {
        padding: 16px 24px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      header h1 {
        margin: 0;
        font-size: 1.6rem;
        font-weight: 600;
        letter-spacing: 0.06em;
      }

      header p {
        margin: 0;
        color: var(--text-soft);
        font-size: 0.9rem;
      }

      #toggle-map {
        display: none;
        margin-top: 8px;
        padding: 6px 14px;
        font-size: 0.85rem;
        color: var(--accent);
        background: rgba(76, 201, 240, 0.12);
        border: 1px solid rgba(76, 201, 240, 0.4);
        border-radius: 999px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      #toggle-map:hover {
        background: rgba(76, 201, 240, 0.25);
      }

      .hidden {
        display: none !important;
      }

      main {
        display: grid;
        grid-template-columns: 3fr 2fr;
        gap: 16px;
        height: calc(100vh - 96px);
        padding: 0 24px 24px 24px;
      }

      #map {
        background: var(--panel-bg);
        border-radius: 16px;
        box-shadow: 0 16px 32px rgba(0, 0, 0, 0.35);
      }

      #news-panel {
        background: var(--panel-bg);
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      #news-panel header {
        padding: 20px 24px 12px 24px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      #news-panel h2 {
        margin: 0;
        font-size: 1.2rem;
        letter-spacing: 0.05em;
      }
      #panel-status {
        min-height: 1.2em;
        font-size: 0.8rem;
      }
      #back-global {
        align-self: flex-start;
        margin-top: 4px;
        padding: 4px 12px;
        font-size: 0.8rem;
        color: var(--accent);
        background: rgba(76, 201, 240, 0.12);
        border: 1px solid rgba(76, 201, 240, 0.4);
        border-radius: 999px;
        cursor: pointer;
      }
      #back-global:hover {
        background: rgba(76, 201, 240, 0.25);
      }
      #news-list.loading {
        opacity: 0.45;
        transition: opacity 0.15s ease;
      }
      #news-list li.notice {
        color: var(--text-soft);
        font-size: 0.9rem;
      }
      #news-list li.notice button {
        margin-left: 8px;
        color: var(--accent);
        background: none;
        border: none;
        font: inherit;
        cursor: pointer;
        text-decoration: underline;
      }
      .summary {
        margin: 8px 0 0;
        color: var(--text-soft);
        font-size: 0.85rem;
      }

      #news-list {
        list-style: none;
        margin: 0;
        padding: 0;
        overflow-y: auto;
        flex: 1;
      }

      #news-list li {
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        padding: 16px 24px;
      }

      #news-list li:last-child {
        border-bottom: none;
      }

      .headline {
        font-size: 1rem;
        color: var(--text);
        margin: 0 0 4px 0;
      }

      .meta {
        font-size: 0.8rem;
        color: var(--text-soft);
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .meta span {
        display: inline-flex;
        gap: 4px;
        align-items: center;
      }

      .pill {
        background: rgba(76, 201, 240, 0.12);
        color: var(--accent);
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 0.75rem;
        letter-spacing: 0.04em;
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }

      a:hover {
        color: var(--accent-strong);
      }

      @media (max-width: 1024px) {
        main {
          grid-template-columns: 1fr;
          grid-template-rows: auto 1fr;
          height: auto;
        }

        #news-panel {
          height: 50vh;
        }
      }

      @media (max-width: 768px) {
        header {
          gap: 8px;
        }

        #toggle-map {
          display: inline-flex;
          align-items: center;
          gap: 6px;
        }

        main {
          grid-template-columns: 1fr;
          grid-template-rows: auto;
          height: auto;
        }

        #map {
          height: 45vh;
          margin-bottom: 12px;
        }

        #map.collapsed {
          display: none;
        }

        #news-panel {
          height: auto;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>World Dashboard · GDELT 实时新闻地图</h1>
      <p>点击国家查看该地区最近 24 小时内的 50 条焦点新闻。</p>
      <button id="toggle-map" class="hidden" aria-expanded="false">显示地图</button>
    </header>
    <main>
      <div id="map"></div>
      <aside id="news-panel">
        <header>
          <h2 id="panel-title">全球热点 · Past 24 Hours</h2>
          <p id="panel-status" aria-live="polite"></p>
          <button id="back-global" class="hidden" type="button">← 返回全球热点</button>
        </header>
        <ul id="news-list"></ul>
      </aside>
    </main>

    <script src="https://fastly.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script>
      // API 根路径：默认同源。可用 window.BACKEND_BASE_URL 或 <meta name="backend-base-url"> 覆盖。
      const API_BASE = (
        window.BACKEND_BASE_URL ||
        (document.querySelector('meta[name="backend-base-url"]')?.getAttribute("content") || "").trim()
      ).replace(/\/+$/, "");

      const GLOBAL_PATH = "/api/global?max_records=50";
      const GLOBAL_SNAPSHOT_KEY = "wd:global:v1";
      const CLIENT_TTL_MS = 5 * 60 * 1000; // 内存缓存：重复点击同一国家不再发请求
      const REFRESH_INTERVAL_MS = 10 * 60 * 1000; // 与服务端缓存 TTL 一致
      const REQUEST_TIMEOUT_MS = 30 * 1000;

      const DEFAULT_MAP_SOURCES = [
        "./world.geo.json",
        "https://fastly.jsdelivr.net/npm/echarts@5/examples/data/asset/world.geo.json",
        "https://cdn.jsdelivr.net/npm/echarts@5/examples/data/asset/world.geo.json",
      ];
      const MAP_SOURCES =
        Array.isArray(window.WORLD_MAP_SOURCES) && window.WORLD_MAP_SOURCES.length
          ? window.WORLD_MAP_SOURCES
          : DEFAULT_MAP_SOURCES;

      const mapEl = document.getElementById("map");
      const chart = echarts.init(mapEl, null, { renderer: "canvas" });
      const toggleMapBtn = document.getElementById("toggle-map");
      const newsPanel = document.getElementById("news-panel");
      const newsList = document.getElementById("news-list");
      const panelTitle = document.getElementById("panel-title");
      const panelStatus = document.getElementById("panel-status");
      const backGlobalBtn = document.getElementById("back-global");
      let mapVisible = true;
      let autoCollapsed = false;

      // ---- 国家索引 -------------------------------------------------------
      // 全程只使用 ISO 3166-1 alpha-2。代码直接取自地图数据本身，
      // 因此地图上的国家名与发送给后端的代码永远一一对应。
      const countryByMapName = new Map(); // 地图名称 -> { iso2, name, lon, lat }
      const countryByIso = new Map(); // ISO2 -> 同上
      let mapReady = false;

      function registerCountries(geoJson) {
        if (!geoJson || !Array.isArray(geoJson.features)) return;
        geoJson.features.forEach((feature) => {
          const props = feature?.properties || {};
          const name = typeof props.name === "string" ? props.name.trim() : "";
          if (!name) return;
          const iso2 =
            [props.iso_a2_eh, props.iso_a2]
              .map((value) => (typeof value === "string" ? value.trim().toUpperCase() : ""))
              .find((value) => /^[A-Z]{2}$/.test(value)) || null;
          const lon = Number(props.label_x);
          const lat = Number(props.label_y);
          const entry = {
            iso2,
            name,
            lon: Number.isFinite(lon) ? lon : null,
            lat: Number.isFinite(lat) ? lat : null,
          };
          if (!countryByMapName.has(name)) countryByMapName.set(name, entry);
          if (iso2 && !countryByIso.has(iso2)) countryByIso.set(iso2, entry);
        });
      }

      async function loadWorldJSON() {
        let lastError = null;
        for (const url of MAP_SOURCES) {
          try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const geoJson = await response.json();
            echarts.registerMap("world", geoJson);
            registerCountries(geoJson);
            mapReady = true;
            return;
          } catch (error) {
            lastError = error;
            console.warn("[Map] Failed to load from", url, error);
          }
        }
        throw new Error(`无法加载世界地图数据：${lastError?.message || "unknown error"}`);
      }

      // ---- 数据层：内存缓存 + 请求合并 + 可取消 ------------------------------
      const responseCache = new Map(); // path -> { data, at }
      const inflight = new Map(); // path -> Promise

      class ApiError extends Error {
        constructor(status, detail) {
          super(detail || `HTTP ${status}`);
          this.status = status;
        }
      }

      async function requestJSON(path) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
        try {
          const res = await fetch(`${API_BASE}${path}`, { signal: controller.signal });
          if (!res.ok) {
            let detail = res.statusText;
            try {
              detail = (await res.json()).detail || detail;
            } catch (_) {}
            throw new ApiError(res.status, detail);
          }
          return await res.json();
        } catch (error) {
          if (error.name === "AbortError") throw new ApiError(0, "请求超时");
          throw error;
        } finally {
          clearTimeout(timer);
        }
      }

      // 同一路径的并发调用共享一次网络请求；force 用于后台刷新时跳过内存缓存。
      function getJSON(path, { force = false } = {}) {
        const cached = responseCache.get(path);
        if (!force && cached && Date.now() - cached.at < CLIENT_TTL_MS) {
          return Promise.resolve(cached.data);
        }
        if (inflight.has(path)) return inflight.get(path);
        const promise = requestJSON(path)
          .then((data) => {
            responseCache.set(path, { data, at: Date.now() });
            return data;
          })
          .finally(() => inflight.delete(path));
        inflight.set(path, promise);
        return promise;
      }

      function readSnapshot() {
        try {
          const snapshot = JSON.parse(sessionStorage.getItem(GLOBAL_SNAPSHOT_KEY));
          return snapshot && Array.isArray(snapshot.articles) ? snapshot : null;
        } catch (_) {
          return null;
        }
      }

      function writeSnapshot(data) {
        try {
          sessionStorage.setItem(GLOBAL_SNAPSHOT_KEY, JSON.stringify(data));
        } catch (_) {}
      }

      // ---- 渲染 -----------------------------------------------------------
      function escapeHtml(value) {
        return String(value).replace(
          /[&<>"']/g,
          (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]
        );
      }

      function formatDate(isoString) {
        if (!isoString) return "时间未知";
        // GDELT seendate is like 20240922T120000Z
        if (/^\d{8}T\d{6}Z$/.test(isoString)) {
          const year = isoString.slice(0, 4);
          const month = isoString.slice(4, 6);
          const day = isoString.slice(6, 8);
          const hour = isoString.slice(9, 11);
          const minute = isoString.slice(11, 13);
          return `${year}-${month}-${day} ${hour}:${minute} UTC`;
        }
        const date = new Date(isoString);
        if (Number.isNaN(date.valueOf())) return isoString;
        return date.toISOString().replace("T", " ").slice(0, 16) + " UTC";
      }

      function buildCountryDatasets(articles) {
        const heat = new Map(); // ISO2 -> { count, headlines }
        articles.forEach((article) => {
          (Array.isArray(article.countries) ? article.countries : []).forEach((country) => {
            const iso2 = country.iso2 ? String(country.iso2).toUpperCase() : null;
            if (!iso2) return;
            if (!heat.has(iso2)) heat.set(iso2, { count: 0, headlines: [] });
            const entry = heat.get(iso2);
            entry.count += 1;
            if (article.title && entry.headlines.length < 3) entry.headlines.push(article.title);
          });
        });

        const areaData = [];
        const scatterData = [];
        let maxHeat = 0;
        heat.forEach((entry, iso2) => {
          const country = countryByIso.get(iso2);
          if (!country) return; // 地图上没有该地区（如部分小型领地）
          maxHeat = Math.max(maxHeat, entry.count);
          areaData.push({ name: country.name, value: entry.count, headlines: entry.headlines });
          if (country.lon != null && country.lat != null) {
            scatterData.push({
              name: country.name,
              value: [country.lon, country.lat, entry.count],
              headlines: entry.headlines,
            });
          }
        });
        return { scatterData, areaData, maxHeat };
      }

      function renderGlobalOption(articles) {
        if (!mapReady) return;
        const { scatterData, areaData, maxHeat } = buildCountryDatasets(articles);
        const visualMax = Math.max(maxHeat || 1, 5);

        chart.setOption({
          backgroundColor: "transparent",
          tooltip: {
            trigger: "item",
            formatter(params) {
              const data = params.data || {};
              const headlines = (data.headlines || [])
                .map((headline) => `<div style="margin-top:4px;">· ${escapeHtml(headline)}</div>`)
                .join("");
              const count =
                params.seriesType === "effectScatter" ? (params.value && params.value[2]) || 0 : params.value || 0;
              return `
                <div style="min-width:180px;max-width:320px;white-space:normal;">
                  <strong>${escapeHtml(params.name)}</strong><br/>
                  热点新闻数量：${Number(count) || 0}${headlines}
                </div>`;
            },
          },
          visualMap: {
            min: 0,
            max: visualMax,
            calculable: false,
            orient: "horizontal",
            left: "center",
            bottom: 30,
            inRange: {
              color: ["#3f37c9", "#4895ef", "#4cc9f0", "#f72585"],
            },
            textStyle: {
              color: "#d9e5ff",
            },
            seriesIndex: [0],
          },
          geo: {
            map: "world",
            roam: true,
            itemStyle: {
              areaColor: "#143158",
              borderColor: "#3984f4",
              borderWidth: 0.3,
            },
            emphasis: {
              itemStyle: {
                areaColor: "#1d4e89",
              },
            },
          },
          series: [
            {
              name: "Country Heat",
              type: "map",
              geoIndex: 0,
              data: areaData,
              itemStyle: {
                borderColor: "#3984f4",
                borderWidth: 0.5,
              },
              emphasis: {
                itemStyle: {
                  areaColor: "#f72585",
                },
              },
            },
            {
              name: "Heat",
              type: "effectScatter",
              coordinateSystem: "geo",
              zlevel: 2,
              // 散点只做视觉提示，点击交给下层的国家区域处理
              silent: true,
              rippleEffect: {
                period: 8,
                scale: 4,
                brushType: "stroke",
              },
              symbolSize(val) {
                return Math.min(28, 8 + Math.sqrt(val[2]) * 4);
              },
              itemStyle: {
                color: "#f72585",
              },
              data: scatterData,
            },
          ],
        });
      }

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text != null) node.textContent = text;
        return node;
      }

      // 所有来自接口的文本都通过 textContent 写入，杜绝 HTML 注入。
      function renderArticles(articles) {
        const fragment = document.createDocumentFragment();
        articles.forEach((article) => {
          const li = document.createElement("li");
          const headline = el("h3", "headline");
          const safeUrl = /^https?:\/\//i.test(article.url || "") ? article.url : null;
          if (safeUrl) {
            const link = el("a", null, article.title || "Untitled");
            link.href = safeUrl;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            headline.appendChild(link);
          } else {
            headline.textContent = article.title || "Untitled";
          }
          li.appendChild(headline);

          const meta = el("div", "meta");
          meta.appendChild(el("span", null, `🕒 ${formatDate(article.time)}`));
          meta.appendChild(el("span", null, `🌐 ${article.source || "未知来源"}`));
          const codes = (article.countries || []).map((c) => c.iso2 || c.name).filter(Boolean);
          if (codes.length) meta.appendChild(el("span", "pill", codes.join(" · ")));
          li.appendChild(meta);

          if (article.summary) li.appendChild(el("p", "summary", article.summary));
          fragment.appendChild(li);
        });
        newsList.replaceChildren(fragment);
        newsList.scrollTop = 0;
      }

      function renderNotice(message, onRetry) {
        const li = el("li", "notice", message);
        if (onRetry) {
          const button = el("button", null, "重试");
          button.type = "button";
          button.addEventListener("click", onRetry);
          li.appendChild(button);
        }
        newsList.replaceChildren(li);
      }

      function setStatus(text) {
        panelStatus.textContent = text || "";
      }

      function describeUpdate(data) {
        const updated = data.updated_at ? formatDate(data.updated_at) : null;
        return `${data.count} 条${updated ? ` · 数据更新于 ${updated}` : ""}`;
      }

      function describeError(error) {
        if (error instanceof ApiError && error.status === 503) return "新闻源暂时限流，请稍后重试。";
        if (error instanceof ApiError && error.status === 400) return "暂不支持查询该地区的新闻。";
        return "新闻加载失败，请检查网络后重试。";
      }

      // ---- 视图状态 -------------------------------------------------------
      // view.token 用来丢弃过期响应：快速连续点击多个国家时，只渲染最后一次点击的结果。
      const view = { mode: "global", token: 0 };
      let globalData = null;
      let globalLoadedAt = 0;

      function showGlobalData(data) {
        globalData = data;
        renderGlobalOption(data.articles);
        if (view.mode !== "global") return;
        panelTitle.textContent = "全球热点 · Past 24 Hours";
        backGlobalBtn.classList.add("hidden");
        newsList.classList.remove("loading");
        if (data.articles.length) renderArticles(data.articles);
        else renderNotice("过去 24 小时内暂无热点新闻。");
        setStatus(describeUpdate(data));
      }

      async function loadGlobalNews({ force = false } = {}) {
        try {
          const data = await getJSON(GLOBAL_PATH, { force });
          globalLoadedAt = Date.now();
          writeSnapshot(data);
          showGlobalData(data);
        } catch (error) {
          console.error(error);
          // 已有数据（快照或上一次结果）时保留展示，只提示刷新失败。
          if (globalData) {
            if (view.mode === "global") setStatus(`${describeUpdate(globalData)} · 刷新失败`);
          } else if (view.mode === "global") {
            setStatus("");
            renderNotice(describeError(error), () => {
              renderNotice("加载中…");
              loadGlobalNews({ force: true });
            });
          }
        }
      }

      function showGlobalView() {
        view.mode = "global";
        view.token += 1;
        if (globalData) showGlobalData(globalData);
        else {
          panelTitle.textContent = "全球热点 · Past 24 Hours";
          backGlobalBtn.classList.add("hidden");
          renderNotice("加载中…");
          loadGlobalNews();
        }
      }

      async function showCountry(identifier, displayName) {
        view.mode = "country";
        const token = (view.token += 1);
        panelTitle.textContent = `${displayName} · 最近 24 小时`;
        backGlobalBtn.classList.remove("hidden");
        newsList.classList.add("loading");
        setStatus("加载中…");

        try {
          const data = await getJSON(`/api/country/${encodeURIComponent(identifier)}?max_records=50`);
          if (token !== view.token) return;
          if (data.articles.length) renderArticles(data.articles);
          else renderNotice("该国家最近 24 小时内暂无新闻。");
          setStatus(describeUpdate(data));
        } catch (error) {
          if (token !== view.token) return;
          console.error(error);
          setStatus("");
          const retryable = !(error instanceof ApiError && error.status === 400);
          renderNotice(describeError(error), retryable ? () => showCountry(identifier, displayName) : null);
        } finally {
          if (token === view.token) newsList.classList.remove("loading");
        }
      }

      chart.on("click", (params) => {
        const name = params.name;
        if (!name) return;
        const country = countryByMapName.get(name);
        showCountry(country?.iso2 || name, name);
      });

      backGlobalBtn.addEventListener("click", showGlobalView);

      // ---- 响应式布局 -----------------------------------------------------
      function applyResponsiveLayout() {
        const mobile = window.innerWidth <= 768;

        if (!toggleMapBtn) {
          requestAnimationFrame(() => chart.resize());
          return;
        }

        if (!mobile) {
          mapVisible = true;
          autoCollapsed = false;
          mapEl.classList.remove("collapsed");
          toggleMapBtn.classList.add("hidden");
          toggleMapBtn.setAttribute("aria-hidden", "true");
          toggleMapBtn.setAttribute("aria-expanded", "true");
          toggleMapBtn.textContent = "隐藏地图";
        } else {
          toggleMapBtn.classList.remove("hidden");
          toggleMapBtn.setAttribute("aria-hidden", "false");
          if (mapVisible) {
            mapEl.classList.remove("collapsed");
            toggleMapBtn.textContent = "隐藏地图";
            toggleMapBtn.setAttribute("aria-expanded", "true");
          } else {
            mapEl.classList.add("collapsed");
            toggleMapBtn.textContent = "显示地图";
            toggleMapBtn.setAttribute("aria-expanded", "false");
          }
        }

        requestAnimationFrame(() => chart.resize());
      }

      if (toggleMapBtn) {
        toggleMapBtn.addEventListener("click", () => {
          if (window.innerWidth > 768) return;
          mapVisible = !mapVisible;
          autoCollapsed = false;
          applyResponsiveLayout();
        });
      }

      if (newsPanel) {
        newsPanel.addEventListener(
          "scroll",
          () => {
            if (window.innerWidth > 768) return;
            const offset = newsPanel.scrollTop || 0;
            if (mapVisible && offset > 140) {
              mapVisible = false;
              autoCollapsed = true;
              applyResponsiveLayout();
            } else if (!mapVisible && autoCollapsed && offset < 40) {
              mapVisible = true;
              autoCollapsed = false;
              applyResponsiveLayout();
            }
          },
          { passive: true }
        );
      }

      // ---- 启动 -----------------------------------------------------------
      function refreshIfStale() {
        if (document.visibilityState !== "visible") return;
        if (Date.now() - globalLoadedAt < REFRESH_INTERVAL_MS) return;
        loadGlobalNews({ force: true });
      }

      (function init() {
        window.addEventListener("resize", applyResponsiveLayout);
        applyResponsiveLayout();

        // 1) 上次会话的快照立即上屏（客户端 stale-while-revalidate）
        const snapshot = readSnapshot();
        if (snapshot) showGlobalData(snapshot);
        else renderNotice("加载中…");

        // 2) 地图与新闻并行加载，互不阻塞；任何一方失败都不影响另一方
        const mapLoad = loadWorldJSON()
          .then(() => {
            renderGlobalOption(globalData ? globalData.articles : []);
            applyResponsiveLayout();
          })
          .catch((error) => {
            console.error(error);
            mapEl.textContent = "地图数据加载失败，新闻列表仍可正常浏览。";
            mapEl.style.cssText += "display:flex;align-items:center;justify-content:center;color:var(--text-soft);";
          });
        const newsLoad = loadGlobalNews();
        Promise.allSettled([mapLoad, newsLoad]);

        // 3) 页面可见时定期刷新；切回标签页时若数据过期则立即刷新
        setInterval(refreshIfStale, 60 * 1000);
        document.addEventListener("visibilitychange", refreshIfStale);
      })();
    </script>
  </body>
</html>
